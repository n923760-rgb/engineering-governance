name: Governance CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: governance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Master Engineering System
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify execution environment capacity
        run: python scripts/verify-environment-capacity.py --path . --min-free-bytes 1048576
      - name: Validate repository contracts
        run: python scripts/validate-repository.py
      - name: Scan tracked text for baseline secret patterns
        run: python scripts/scan-secrets.py
      - name: Run governance stop-condition qualification
        run: python qualification/run-qualification.py
      - name: Verify Master Engineering System readiness
        run: python scripts/verify-system-readiness.py
      - name: Record source identity
        run: |
          printf 'tested_sha=%s\n' "$(git rev-parse HEAD)"
          printf 'branch_or_ref=%s\n' "${GITHUB_REF}"
          git status --short
