name: Verify historical v1.0.0 release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify immutable v1.0.0 release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout published v1.0.0 tag
        uses: actions/checkout@v4
        with:
          ref: v1.0.0
          fetch-depth: 0
          fetch-tags: true
      - name: Verify historical v1 source and readiness
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.0.0"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 v1.0.0)"
          python scripts/verify-v1-readiness.py
      - name: Record historical release identity
        run: |
          printf 'tag=v1.0.0\n'
          printf 'tag_sha=%s\n' "$(git rev-list -n 1 v1.0.0)"
          printf 'release_action=verification_only\n'
