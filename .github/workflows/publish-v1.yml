name: Publish v1.0.0

on:
  workflow_run:
    workflows:
      - Governance CI
    types:
      - completed

permissions:
  contents: write

jobs:
  publish:
    name: Publish stable v1.0.0
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact qualified main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify exact stable source
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.0.0"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python scripts/verify-v1-readiness.py

      - name: Publish v1.0.0 if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.0 release already exists; no action required."
            exit 0
          fi

          if git show-ref --verify --quiet refs/tags/v1.0.0; then
            TAG_SHA="$(git rev-list -n 1 v1.0.0)"
            test "$TAG_SHA" = "$TARGET_SHA"
            gh release create v1.0.0               --repo "$GITHUB_REPOSITORY"               --verify-tag               --title "Engineering Governance v1.0.0"               --notes-file docs/RELEASE_NOTES_V1.0.0.md
          else
            gh release create v1.0.0               --repo "$GITHUB_REPOSITORY"               --target "$TARGET_SHA"               --title "Engineering Governance v1.0.0"               --notes-file docs/RELEASE_NOTES_V1.0.0.md
          fi

      - name: Verify published release target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          TAG_SHA="$(git rev-list -n 1 v1.0.0)"
          test "$TAG_SHA" = "$TARGET_SHA"
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url
