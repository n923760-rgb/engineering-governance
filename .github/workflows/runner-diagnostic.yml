name: Runner Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Runner smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Prove runner execution
        run: |
          echo "RUNNER_EXECUTION=PASS"
          echo "sha=$GITHUB_SHA"
          echo "ref=$GITHUB_REF"
          uname -a
          python3 --version || true
